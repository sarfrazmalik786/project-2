<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .calculator {
    background: #2b2b40;
    border-radius: 16px;
    padding: 20px;
    width: 300px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  #display {
    width: 100%;
    height: 70px;
    background: #14141f;
    color: #fff;
    font-size: 2rem;
    text-align: right;
    border: none;
    border-radius: 10px;
    padding: 0 15px;
    margin-bottom: 15px;
    box-sizing: border-box;
    overflow-x: auto;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    padding: 18px 0;
    font-size: 1.1rem;
    border: none;
    border-radius: 10px;
    background: #3c3c55;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4c4c6a; }
  button.operator { background: #ff9f43; }
  button.operator:hover { background: #ffb066; }
  button.equals { background: #4caf50; grid-column: span 2; }
  button.equals:hover { background: #5cc85f; }
  button.clear { background: #e74c3c; }
  button.clear:hover { background: #ee6a5b; }
  #error {
    color: #ff6b6b;
    font-size: 0.85rem;
    min-height: 18px;
    margin-top: 8px;
    text-align: right;
  }
</style>
</head>
<body>

<div class="calculator">
  <input id="display" type="text" value="0" readonly>
  <div id="error"></div>
  <div class="buttons">
    <button class="clear" data-action="clear">C</button>
    <button data-action="backspace">⌫</button>
    <button class="operator" data-op="divide">÷</button>
    <button class="operator" data-op="multiply">×</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="operator" data-op="subtract">−</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="operator" data-op="add">+</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button data-num="0">0</button>

    <button data-num=".">.</button>
    <button class="equals" data-action="equals">=</button>
  </div>
</div>

<script>
  // ----- Calculator logic -----
  function add(a, b) { return a + b; }
  function subtract(a, b) { return a - b; }
  function multiply(a, b) { return a * b; }
  function divide(a, b) {
    if (b === 0) throw new Error('Division by zero is not allowed');
    return a / b;
  }
  const Calculator = { add, subtract, multiply, divide };

  // ----- UI wiring -----
  const display = document.getElementById('display');
  const errorEl = document.getElementById('error');

  let current = '0';
  let previous = null;
  let pendingOp = null;
  let justEvaluated = false;

  function updateDisplay() {
    display.value = current;
  }

  function clearError() {
    errorEl.textContent = '';
  }

  function showError(message) {
    errorEl.textContent = message;
  }

  function inputNumber(num) {
    if (justEvaluated) {
      current = num === '.' ? '0.' : num;
      justEvaluated = false;
    } else if (num === '.' && current.includes('.')) {
      return;
    } else if (current === '0' && num !== '.') {
      current = num;
    } else {
      current += num;
    }
    updateDisplay();
  }

  function inputOperator(op) {
    if (pendingOp && previous !== null && !justEvaluated) {
      evaluate();
    }
    previous = parseFloat(current);
    pendingOp = op;
    justEvaluated = false;
    current = '0';
  }

  function evaluate() {
    if (pendingOp === null || previous === null) return;
    try {
      clearError();
      const a = previous;
      const b = parseFloat(current);
      const result = Calculator[pendingOp](a, b);
      current = String(result);
      previous = null;
      pendingOp = null;
      justEvaluated = true;
      updateDisplay();
    } catch (err) {
      showError(err.message);
    }
  }

  function clearAll() {
    current = '0';
    previous = null;
    pendingOp = null;
    justEvaluated = false;
    clearError();
    updateDisplay();
  }

  function backspace() {
    current = current.length > 1 ? current.slice(0, -1) : '0';
    updateDisplay();
  }

  document.querySelectorAll('[data-num]').forEach((btn) => {
    btn.addEventListener('click', () => inputNumber(btn.dataset.num));
  });

  document.querySelectorAll('[data-op]').forEach((btn) => {
    btn.addEventListener('click', () => inputOperator(btn.dataset.op));
  });

  document.querySelector('[data-action="equals"]').addEventListener('click', evaluate);
  document.querySelector('[data-action="clear"]').addEventListener('click', clearAll);
  document.querySelector('[data-action="backspace"]').addEventListener('click', backspace);

  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
    else if (e.key === '.') inputNumber('.');
    else if (e.key === '+') inputOperator('add');
    else if (e.key === '-') inputOperator('subtract');
    else if (e.key === '*') inputOperator('multiply');
    else if (e.key === '/') { e.preventDefault(); inputOperator('divide'); }
    else if (e.key === 'Enter' || e.key === '=') evaluate();
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
  });

  updateDisplay();
</script>

</body>
</html>
